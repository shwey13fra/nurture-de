# sources.yaml — Citable documents for NurtureDE
# =============================================================================
# Every entry here is a document that WILL be fetched, chunked, indexed, and
# cited. Action endpoints (interactive directories) live in referrals.yaml and
# are never ingested — see that file for the distinction.
#
# Field ownership (which task fills what):
#   Task 2 (now):   id, url, file, authority, authority_tier, category,
#                   language, jurisdiction, pairs_with, notes
#   Task 4 (fetch): content_hash, last_verified_date
#   Task 5 (meta):  topic, subtopic, user_type, insurance_type
# Fields owned by a later task are `null` here on purpose — not missing data.
#
# Enums:
#   authority_tier : primary-law | federal | statutory-insurer | land
#                    (primary-law = the statute text itself; ranks ABOVE federal
#                    plain-language sources. Intended as a retrieval RANKING
#                    signal on Day 3 — see gii_muschg_2018 notes.)
#   category       : legal-administrative | health | insurer-official
#   language       : de | en
#
# Lifecycle fields (optional; present only when relevant):
#   status         : superseded   — kept for the record, not ingested/cited
#   superseded_by  : <id>         — the entry that replaced this one
#
# pairs_with: cross-links a federal page (states the statutory RULE) with an
#   insurer page (states the PROCESS) covering the same topic. Used on Day 3 to
#   test whether the system cites the right register for the question asked.
# =============================================================================

